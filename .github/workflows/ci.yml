name: CI — Train & Build Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12.7"
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-model

jobs:
  train:
    name: Train Model (MLflow Project)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: MLProject

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn==1.5.2 pandas==2.2.3 \
                      numpy==1.26.4 matplotlib==3.9.2

      - name: Run Training
        env:
          DAGSHUB_OWNER: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_REPO: Workflow-CI
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python modelling.py \
            --n_estimators 200 \
            --max_depth 10 \
            --min_samples_split 5 \
            --min_samples_leaf 2

      - name: Verify Model Output
        run: |
          echo "=== Model output ===" && ls -la model_output/ || echo "No model_output dir"
          echo "=== Artifacts ===" && ls -la artifacts/ || echo "No artifacts dir"

      - name: Upload Model Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: wine-quality-model-${{ github.run_number }}
          path: |
            MLProject/model_output/
            MLProject/artifacts/
          retention-days: 90

      - name: Commit Model Artifacts to Repository
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions CI"
          git add model_output/ artifacts/ || true
          git diff --staged --quiet || \
            git commit -m "ci: update model artifacts [run #${{ github.run_number }}] [skip ci]"
          git push || echo "Nothing to push"

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: train
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Model Artifact
        uses: actions/download-artifact@v4
        with:
          name: wine-quality-model-${{ github.run_number }}
          path: MLProject/

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM python:3.12-slim
          WORKDIR /app
          RUN pip install --no-cache-dir \
              mlflow==2.19.0 \
              scikit-learn==1.5.2 \
              pandas==2.2.3 \
              numpy==1.26.4
          COPY MLProject/ /app/
          EXPOSE 8080
          CMD ["mlflow", "models", "serve", "--model-uri", "/app/model_output/wine_quality_model", "--host", "0.0.0.0", "--port", "8080", "--no-conda"]
          EOF

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:run-${{ github.run_number }}

      - name: Save Docker Hub Link
        run: |
          echo "https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-model" \
            > docker_hub_link.txt
          cat docker_hub_link.txt

      - name: Upload Docker Hub Link
        uses: actions/upload-artifact@v4
        with:
          name: docker-hub-info
          path: docker_hub_link.txt